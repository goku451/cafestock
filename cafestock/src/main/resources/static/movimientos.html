<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Movimiento - CafeStock</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --admin-dark: #1e293b;
            --admin-primary: #0f766e;
            --admin-accent: #0d9488;
        }

        body {
            background-color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar-admin {
            background-color: var(--admin-dark);
            border-bottom: 3px solid var(--admin-accent);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-admin">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="admin.html">
            <span class="fs-4 me-2">☕</span> Cafe<span class="text-info">Stock</span> Admin
        </a>
        <div class="d-flex align-items-center gap-3">
            <span class="navbar-text text-white small" id="userName">Hola, Admin</span>
            <a href="admin.html" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-left me-1"></i> Volver al Panel
            </a>
            <button class="btn btn-danger btn-sm" onclick="logout()">
                <i class="bi bi-box-arrow-right"></i> Salir
            </button>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card shadow-sm border-0" style="border-radius: 1rem;">
                <div class="card-header bg-white py-3 border-bottom">
                    <h5 class="mb-0 fw-bold text-dark">
                        <i class="bi bi-arrow-left-right text-primary me-2"></i> Registrar Movimiento de Inventario
                    </h5>
                    <small class="text-muted">Ajusta manualmente el stock por compras (entrada) o mermas/consumos (salida)</small>
                </div>
                <div class="card-body p-4">
                    <form id="movForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Insumo a modificar</label>
                            <select class="form-select form-select-lg" id="insumoSelect" required>
                                <option value="">Cargando insumos...</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold d-block">Tipo de Movimiento</label>
                            <div class="row g-2">
                                <div class="col-6">
                                    <input type="radio" class="btn-check" name="tipoMov" id="tipoEntrada" value="entrada" checked required>
                                    <label class="btn btn-outline-success w-100 py-3 fw-bold" for="tipoEntrada">
                                        <i class="bi bi-box-arrow-in-down fs-4 d-block mb-1"></i>
                                        Entrada (Compra / Abastecimiento)
                                    </label>
                                </div>
                                <div class="col-6">
                                    <input type="radio" class="btn-check" name="tipoMov" id="tipoSalida" value="salida">
                                    <label class="btn btn-outline-danger w-100 py-3 fw-bold" for="tipoSalida">
                                        <i class="bi bi-box-arrow-up fs-4 d-block mb-1"></i>
                                        Salida (Merma / Consumo)
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Cantidad a registrar</label>
                            <div class="input-group input-group-lg">
                                <input type="number" step="0.01" min="0.01" class="form-control" id="cantidad" placeholder="Ej: 5.0" required>
                                <span class="input-group-text bg-light text-muted" id="unidadLabel">unidades</span>
                            </div>
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                            <a href="admin.html" class="btn btn-outline-secondary px-4">Cancelar</a>
                            <button type="submit" class="btn btn-primary btn-lg px-4 fw-bold" id="btnSubmit">
                                <i class="bi bi-check2-circle me-1"></i> Registrar Movimiento
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let user = null;
    let insumosList = [];

    document.addEventListener('DOMContentLoaded', () => {
        const userStr = localStorage.getItem('user');
        if (!userStr) {
            window.location.href = 'login.html';
            return;
        }
        user = JSON.parse(userStr);
        document.getElementById('userName').textContent = 'Hola, ' + (user.nombre || 'Admin');
        
        loadInsumos();

        document.getElementById('insumoSelect').addEventListener('change', (e) => {
            const insId = parseInt(e.target.value);
            const found = insumosList.find(i => i.idInsumo === insId);
            if (found) {
                document.getElementById('unidadLabel').textContent = found.unidadMedida || 'unidades';
            }
        });
    });

    async function loadInsumos() {
        try {
            const res = await fetch('/api/insumos');
            insumosList = await res.json();
            const select = document.getElementById('insumoSelect');
            select.innerHTML = '<option value="">Seleccione un insumo...</option>';
            insumosList.forEach(ins => {
                const option = document.createElement('option');
                option.value = ins.idInsumo;
                option.textContent = `${ins.nombre} — Stock actual: ${ins.stockActual} ${ins.unidadMedida}`;
                select.appendChild(option);
            });
        } catch (error) {
            console.error(error);
        }
    }

    document.getElementById('movForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const idInsumo = document.getElementById('insumoSelect').value;
        const tipo = document.querySelector('input[name="tipoMov"]:checked').value;
        const cantidad = parseFloat(document.getElementById('cantidad').value);
        const btnSubmit = document.getElementById('btnSubmit');

        if (!idInsumo || isNaN(cantidad) || cantidad <= 0) {
            alert('Por favor complete los campos correctamente.');
            return;
        }

        btnSubmit.disabled = true;
        btnSubmit.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Registrando...`;

        try {
            const res = await fetch('/api/movimientos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    idInsumo: parseInt(idInsumo),
                    idUsuario: user.idUsuario || 1,
                    tipo: tipo,
                    cantidad: cantidad
                })
            });
            
            if (res.ok) {
                alert('¡Movimiento registrado con éxito!');
                window.location.href = 'admin.html';
            } else {
                const err = await res.json();
                alert(err.error || 'Error al registrar movimiento');
            }
        } catch (error) {
            console.error(error);
            alert('Error de conexión con el servidor.');
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = `<i class="bi bi-check2-circle me-1"></i> Registrar Movimiento`;
        }
    });

    function logout() {
        localStorage.removeItem('user');
        window.location.href = 'login.html';
    }
</script>

</body>
</html>
